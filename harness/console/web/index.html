<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ShallowSee Autopilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Cpath d='M9 21l5-10 4 7 2-4 3 7' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Set the theme before first paint (light is the default; "system" follows the OS).
    try {
      var t = localStorage.getItem("shallowsee.theme");
      if (t === "light" || t === "dark" || t === "system") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage may be blocked; the default stays light */ }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/new" aria-label="ShallowSee Autopilot, make a wish">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="24" height="24"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 21l5-10 4 7 2-4 3 7" fill="none" style="stroke: var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-text">ShallowSee <b>Autopilot</b></span>
    </a>
    <nav id="nav" class="nav" aria-label="Main">
      <a href="#/new" data-nav="new">Make a wish</a>
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/setup" data-nav="setup">Setup</a>
    </nav>
    <div class="top-actions">
      <span id="connection" class="conn" role="status" aria-live="polite"></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme" title="Theme"></button>
    </div>
  </header>
  <main id="app" tabindex="-1"><p class="muted pad">Loading…</p></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="pad">ShallowSee Autopilot needs JavaScript to run.</p></noscript>
</body>
</html>
